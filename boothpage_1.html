<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บูทเครื่องเล่น - งานวัด</title>
    <link rel="stylesheet" href="css/boothstyle.css">
</head>
<body>
    <header>
        <h1>บูทเครื่องเล่น</h1>
        <a href="Directory.html" class="home-btn">🏠 กลับหน้าหมวดหมู่</a>
    </header>

    <section class="booth">
        <div class="intro">
            <div class="intro-image">
                <img src="resources/image/Background.png" alt="รูปงานวัด">
            </div>
            <p>เครื่องเล่นต่างๆในงานวัด</p>
        </div>

        <div class="products">
            <div class="product">
                <div class="product-image">
                    <img src="resources/picture5.jpg" alt="ชิงช้าสวรรค์">
                </div>
                <h3>ชิงช้าสวรรค์</h3>
                <p>รับชมวิวจากมุมสูง</p>
                <p class="price">ราคา: 50 บาท</p>
                <button>สั่งซื้อ</button>
            </div>

            <div class="product">
                <div class="product-image">
                    <img src="resources/image/ghosthouse.png" alt="บ้านผีสิง">
                </div>
                <h3>บ้านผีสิง</h3>
                <p>พบกับความหลอนจนต้องร้องกรี๊ด</p>
                <p class="price">ราคา: 50 บาท</p>
                <button>สั่งซื้อ</button>
            </div>

            <div class="product">
                <div class="product-image">
                    <img src="resources/image/dartgame.png" alt="ปาโป่ง">
                </div>
                <h3>ปาโป่ง หรรษา</h3>
                <p>ลุ้นรับของรางวัลได้เลยย</p>
                <p class="price">ราคา: 40 บาท</p>
                <button>สั่งซื้อ</button>
            </div>
        </div>
    </section>

    <footer>
        <p>งานวัด - บูทเครื่องเล่น</p>
    </footer>
</body>
</html>
