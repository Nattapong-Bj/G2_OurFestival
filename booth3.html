<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="บูทอาหารคาวไทยย้อนยุค — รสชาติบ้านๆ แบบงานวัด พร้อมเมนูไก่ทอด ลูกชิ้น หมูสะเต๊ะ" />
  <title>บูทอาหารคาวย้อนยุค - งานวัด</title>
  <link rel="stylesheet" href="css/booth34style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>บูทอาหารคาวไทยย้อนยุค</h1>
    <a href="index.html" class="home-btn">🏠 กลับหน้าหลัก</a>
  </header>

  <section class="booth">
    <div class="intro">
      <div class="intro-image">
        <img src="resources/booth3-4img/sumkaw.png" alt="บรรยากาศงานวัดสมัยก่อน" />
      </div>
      <div class="intro-text">
        <p>รสชาติบ้านๆ แบบงานวัดสมัยก่อน กลิ่นเตาถ่าน โดนใจสุด</p>
      </div>
    </div>

    <div class="products">
      <div class="product">
        <div class="product-image">
          <img src="resources/booth3-4img/kai.png" alt="ไก่ทอดงานวัด" />
        </div>
        <h3>ไก่ทอดงานวัด</h3>
        <p>กรอบนอกฉ่ำใน โรยพริกไทยกระเทียม</p>
        <p class="price">ราคา: 45 บาท</p>
        <button>สั่งซื้อ</button>
      </div>

      <div class="product">
        <div class="product-image">
          <img src="resources/booth3-4img/meatball.png" alt="ลูกชิ้นปิ้ง" />
        </div>
        <h3>ลูกชิ้นปิ้ง</h3>
        <p>น้ำจิ้มสามรส สูตรงานวัด</p>
        <p class="price">ราคา: 25 บาท</p>
        <button>สั่งซื้อ</button>
      </div>

      <div class="product">
        <div class="product-image">
          <img src="resources/booth3-4img/moo.png" alt="หมูสะเต๊ะ" />
        </div>
        <h3>หมูสะเต๊ะ</h3>
        <p>หอมขมิ้น กินคู่แตงกวาดอง</p>
        <p class="price">ราคา: 40 บาท</p>
        <button>สั่งซื้อ</button>
      </div>
    </div>
  </section>

  <footer>
    <p>งานวัด - บูทอาหารคาวไทยย้อนยุค</p>
  </footer>

  <script src="JS/booth.js" defer></script>
</body>
</html>
