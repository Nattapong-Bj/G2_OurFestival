<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บูทของเล่น - งานวัด</title>
    <link rel="stylesheet" href="boothstyle.css">
</head>
<body>
    <header>
        <h1>บูทของเล่นสนุก</h1>
        <a href="index.html" class="home-btn">🏠 กลับหน้าหลัก</a>
    </header>

    <section class="booth">
        <div class="intro">
            <div class="intro-image">
                <img src="image/Background.png" alt="ชิงช้าสวรรค์">
            </div>
            <p>บูทของเล่นสนุก ๆ สำหรับเด็ก ๆ ในงานวัด</p>
        </div>

        <div class="products">
            <div class="product">
                <div class="product-image">
                    <img src="image/watergun.png" alt="ชิงช้าสวรรค์">
                </div>
                <h3>ปืนฉีดน้ำ</h3>
                <p>ฉีดสนุก เย็นสะใจ</p>
                <p class="price">ราคา: 35 บาท</p>
                <button>สั่งซื้อ</button>
            </div>

            <div class="product">
                <div class="product-image">
                    <img src="image/balloon.png" alt="บ้านผีสิง">
                </div>
                <h3>ลูกโป่งลม</h3>
                <p>สีสันสดใส เด็กชอบแน่นอน</p>
                <p class="price">ราคา: 20 บาท</p>
                <button>สั่งซื้อ</button>
            </div>

            <div class="product">
                <div class="product-image">
                    <img src="image/gangharn.png" alt="ปาโป่ง">
                </div>
                <h3>กังหันลมกระดาษ</h3>
                <p>หมุนเล่นรับลมเย็น ๆ หน้างาน</p>
                <p class="price">ราคา: 25 บาท</p>
                <button>สั่งซื้อ</button>
            </div>
        </div>
    </section>

    <footer>
        <p>งานวัด - บูทเครื่องเล่น</p>
    </footer>
</body>
</html>
