<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บูทของหวานย้อนยุค - งานวัด</title>
    <link rel="stylesheet" href="css/boothstyle.css">
</head>
<body>
    <header>
        <h1>บูทของหวานไทยย้อนยุค</h1>
        <a href="Directory.html" class="home-btn">🏠 กลับหน้าหมวดหมู่</a>
    </header>

    <section class="booth">
        <div class="intro">
            <div class="intro-image">
                <img src="resources/image/Background.png" alt="รูปงานวัด">
            </div>
            <p>หวานหอมแบบไทยๆ ย้อนความทรงจำสมัยเด็ก</p>
        </div>

        <div class="products">
            <div class="product">
                <div class="product-image">
                    <img src="resources/booth3-4img/kanom,.png" alt="ขนมครก">
                </div>
                <h3>ขนมครก</h3>
                <p>หน้าข้าวโพด/ต้นหอม แป้งหอมกะทิ</p>
                <p class="price">ราคา: 30 บาท</p>
                <button>สั่งซื้อ</button>
            </div>

            <div class="product">
                <div class="product-image">
                    <img src="resources/booth3-4img/saimai.png" alt="สายไหม">
                </div>
                <h3>สายไหม</h3>
                <p>นุ่มฟู สีหวานละมุน</p>
                <p class="price">ราคา: 25 บาท</p>
                <button>สั่งซื้อ</button>
            </div>

            <div class="product">
                <div class="product-image">
                    <img src="resources/booth3-4img/kluai.png" alt="กล้วยเชื่อม">
                </div>
                <h3>กล้วยเชื่อม</h3>
                <p>หอมใบเตย ราดกะทิ</p>
                <p class="price">ราคา: 35 บาท</p>
                <button>สั่งซื้อ</button>
            </div>
        </div>
    </section>

    <footer>
        <p>งานวัด - บูทของหวานไทยย้อนยุค</p>
    </footer>
</body>
</html>
