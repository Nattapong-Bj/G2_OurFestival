<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link rel="stylesheet" href="css/styleRegistration.css">
</head>
<body>

  <form id="registrationForm" method="POST">
    <h3>Registration</h3>
    <fieldset>
      <legend>Personal Information</legend>

      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname">
      <div id="fullname-error" class="error-message"></div>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
      <div id="email-error" class="error-message"></div>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="1" max="100">
      <div id="age-error" class="error-message"></div>

      <label>Gender:</label>
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
      <input type="radio" name="gender" value="other"> Other
      <div id="gender-error" class="error-message"></div>

      <label>Booth Interests:</label>
      <input type="checkbox" name="interests" value="booth1"> Booth 1
      <input type="checkbox" name="interests" value="booth2"> Booth 2
      <input type="checkbox" name="interests" value="booth3"> Booth 3
      <input type="checkbox" name="interests" value="booth4"> Booth 4
      <div id="interests-error" class="error-message"></div>

      <input type="submit" value="Submit">
      <div id="success" class="success-message"></div>
    </fieldset>
  </form>

  <script src="JS/registration.js"></script>
</body>
</html>
